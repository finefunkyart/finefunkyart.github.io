name: Refresh Kodak Bullet camera image
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh Bullet image URL
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('cameras.html')
          s = p.read_text()
          s = s.replace('images/cameras/kodak-bullet-museum-20260907.jpg?v=20260907-bullet-clean', 'images/cameras/kodak-bullet-museum-20260907.jpg?v=20260907-bullet-final-2')
          p.write_text(s)
          PY
      - name: Commit refresh
        run: |
          git config user.name "Jaqulin Site Fix"
          git config user.email "actions@users.noreply.github.com"
          git add cameras.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh Kodak Bullet image cache"
          git push
