name: Cache-bust homepage stylesheet

on:
  push:
    paths:
      - '.github/workflows/cache-bust-homepage.yml'

permissions:
  contents: write

jobs:
  fix-homepage-style-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add stylesheet version to homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<link rel="stylesheet" href="styles.css" />'
          new = '<link rel="stylesheet" href="styles.css?v=20260907-mobile-fix" />'
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
          PY
      - name: Commit homepage cache-bust
        run: |
          git config user.name "Jaqulin Site Fix"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Force homepage stylesheet refresh"
          git push
