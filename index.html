<figure class="museum-card"><div class="art-mat"><img src="assets/abstract-bottles-fruit.jpg?v=20260830b" alt="Bottles and Fruit by Jaqulin Joseph"></div><figcaption><p class="medium">Painting</p><h3>Bottles and Fruit</h3><p>There is beauty in the ordinary when we allow ourselves to truly see it. Familiar bottles, fruit, vessels and shapes gather until everyday things become something else. Form becomes rhythm. Color becomes movement. Objects that might normally sit quietly on a table begin to communicate with one another. I was interested not only in painting what was there, but in discovering what else I could see within it. A bottle can become architecture. Fruit becomes echoes of color and energy. The space between objects becomes just as important as the objects themselves. That is one of the freedoms abstraction gives me as an artist: I don’t have to reproduce the world exactly as it appears. I can take what is familiar, turn it slightly, and invite you to see it again.</p></figcaption></figure>
